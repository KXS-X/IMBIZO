version: '3.8'

services:
  # --------------------------------------------------------------------------
  # Base de Données PostgreSQL
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: devops_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-devops_tracker}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d devops_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - devops_network

  # --------------------------------------------------------------------------
  # Backend Node.js / Express + Prisma + Socket.io
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: devops_tracker_backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-devops_tracker}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-devops_tracker_super_secret_jwt_key_2026_change_in_prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push && npm start"
    networks:
      - devops_network

  # --------------------------------------------------------------------------
  # Frontend React (Vite) + Nginx
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: devops_tracker_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - devops_network

# ----------------------------------------------------------------------------
# Volumes et Réseaux
# ----------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

networks:
  devops_network:
    driver: bridge
